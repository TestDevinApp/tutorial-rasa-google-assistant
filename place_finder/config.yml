version: "3.1"
assistant_id: place_finder_assistant

language: en

pipeline:
- name: SpacyNLP
  model: "en_core_web_sm"
- name: SpacyTokenizer
- name: SpacyFeaturizer
- name: CRFEntityExtractor
- name: DIETClassifier
  epochs: 100
- name: DucklingEntityExtractor
  url: "http://localhost:8000"
  dimensions: ["number"]

policies:
- name: MemoizationPolicy
- name: RulePolicy
- name: UnexpecTEDIntentPolicy
  max_history: 5
  epochs: 100
- name: TEDPolicy
  max_history: 5
  epochs: 100
