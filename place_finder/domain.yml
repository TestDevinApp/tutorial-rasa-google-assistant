version: "3.1"

slots:
  query:
    type: text
    mappings:
    - type: from_entity
      entity: query
  number:
    type: text
    mappings:
    - type: from_entity
      entity: number
  rating:
    type: any
    mappings:
    - type: custom
  address:
    type: any
    mappings:
    - type: custom
  opening_hours:
    type: any
    mappings:
    - type: custom
  location_match:
    type: categorical
    values:
    - none
    - one
    mappings:
    - type: custom


intents:
 - greet
 - thanks
 - goodbye
 - place_search
 - opening_hours
 - address
 - rating
 - inform
 

entities:
 - query
 - number

responses:
  utter_greet:
    - text: "Hello! I am a places search assistant. I can help you find places wherever you are, provide information about the location like opening hours, rating, address. So what are you looking for?"
  utter_goodbye:
    - text: "Talk to you later!"
  utter_thanks:
    - text: "You are very welcome."
  utter_what_radius:
    - text: "Within what radius?"
  utter_rating:
    - text: "The rating is {rating}"
  utter_address:
    - text: "The address is {address}."
  utter_opening_hours:
    - text: "The place is {opening_hours}"
  utter_no_results:
    - text: "Sorry, I couldn't find anything."

actions:
  - utter_greet
  - utter_goodbye
  - utter_thanks
  - utter_what_radius
  - utter_rating
  - utter_opening_hours
  - utter_address
  - utter_no_results
  - action_place_search
